name: CI

on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

env:
  PYTHON: python3

jobs:
  build-and-test:
    name: ${{ matrix.renderer }} renderer
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: javascript
            test_command: npm test
          - renderer: raylib
            test_command: npm run test:raylib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WPT system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-atspi-2.0 \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config \
            python3-dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Cache WPT checkout
        uses: actions/cache@v4
        with:
          path: .wpt-upstream
          key: wpt-${{ runner.os }}-${{ hashFiles('scripts/wpt-config.mjs') }}

      - name: Set up WPT
        run: npm run wpt:setup

      - name: Cache raylib vendor
        if: matrix.renderer == 'raylib'
        uses: actions/cache@v4
        with:
          path: vendor/raylib
          key: raylib-${{ runner.os }}-${{ hashFiles('scripts/init-raylib-vendor.mjs') }}

      - name: Set up raylib vendor
        if: matrix.renderer == 'raylib'
        run: npm run init:raylib

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: ${{ matrix.test_command }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.renderer }}
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>raylib-canvas basic example</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f4f0;
      }

      main {
        display: grid;
        gap: 12px;
      }

      img {
        width: min(800px, calc(100vw - 32px));
        height: auto;
        border: 1px solid #d7d7cf;
        background: white;
      }

      p {
        margin: 0;
        color: #333;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <img id="output" alt="Generated canvas output">
      <p id="status">Rendering...</p>
    </main>
    <script type="module" src="./dist/basic.js"></script>
  </body>
</html>
